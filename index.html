<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EARTH RIGHT NOW | Free Live Earth Screensaver</title>
<meta name="description" content="Relax and watch our living planet. Free live Earth screensaver.">
<style>
*{box-sizing:border-box}body{margin:0;background:#050c16;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:18px 12px 12px}h1{font-size:clamp(22px,4vw,36px);margin:5px}p{color:#b9c9d8}
.player{width:min(95vw,1200px);aspect-ratio:16/9;margin:auto;background:#101e2c;display:grid;place-items:center}
iframe{width:100%;height:100%;border:0}a{color:#a9d9ff}
.actions{padding:18px}button{background:#244e72;color:white;border:0;border-radius:8px;padding:12px 20px;cursor:pointer}
</style>
</head>
<body>
<header><h1>EARTH RIGHT NOW</h1><p>Your Window to a Living Planet</p><p>Free Live Earth Screensaver — Watch Our Planet, Anytime.</p></header>
<main><div class="player" id="player"><div id="setup">Add your YouTube Live video ID to the URL after <b>?v=</b><br><small>Example: index.html?v=YOUR_VIDEO_ID</small></div></div></main>
<div class="actions"><button onclick="document.getElementById('player').requestFullscreen()">Full screen</button> <a id="youtube" href="https://www.youtube.com/" target="_blank" rel="noopener">Watch the Full Experience on YouTube</a></div>
<script>
const id=new URLSearchParams(location.search).get('v');
if(id && /^[a-zA-Z0-9_-]{11}$/.test(id)){
const iframe=document.createElement('iframe');
iframe.src='https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1&playsinline=1';
iframe.title='EARTH RIGHT NOW Live';iframe.allow='autoplay;encrypted-media;picture-in-picture;fullscreen';
iframe.allowFullscreen=true;
document.getElementById('player').replaceChildren(iframe);
document.getElementById('youtube').href='https://www.youtube.com/watch?v='+id;
}
</script></body></html>
