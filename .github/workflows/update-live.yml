
name: ERN live stream detector

on:
  push:
    paths:
      - 'scripts/check_live.py'
      - 'scripts/update_seo.py'
      - '.github/workflows/update-live.yml'
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ern-live-detector
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install detector
        run: python -m pip install --disable-pip-version-check 'yt-dlp>=2025.1.1'
      - name: Detect current live stream
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python scripts/check_live.py
      - name: Synchronize Google video metadata and sitemap
        run: python scripts/update_seo.py
      - name: Commit status and SEO only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live.json index.html sitemap.xml sitemap-ern.xml sitemap.txt feed.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Update ERN live stream status'
            git pull --rebase origin main
            git push
          fi
