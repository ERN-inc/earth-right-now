<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EARTH RIGHT NOW — Live Embed</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{width:100%;height:100%;border:0}#offline{display:none;box-sizing:border-box;position:absolute;inset:0;padding:24px;background:#071522;color:#eef7ff;font:16px/1.5 system-ui,sans-serif;text-align:center;align-content:center}#offline a{color:#69dbdc}</style>
</head>
<body>
<iframe id="ern-live" title="EARTH RIGHT NOW live stream" allow="autoplay; encrypted-media; picture-in-picture; web-share; fullscreen" allowfullscreen></iframe>
<div id="offline" role="status"><p>EARTH RIGHT NOW live playback is currently unavailable.</p><p><a href="https://www.youtube.com/@earth_right_now/live" target="_blank" rel="noopener noreferrer">Check the live channel on YouTube</a> · <a href="./" target="_blank" rel="noopener noreferrer">Visit EARTH RIGHT NOW</a></p></div>
<script>
(async()=>{
  const frame=document.getElementById('ern-live');
  const showOffline=()=>{frame.style.display='none';document.getElementById('offline').style.display='block';};
  try{
    const r=await fetch('./live.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('status');
    const d=await r.json();
    if(d.status==='live'&&/^[A-Za-z0-9_-]{11}$/.test(String(d.videoId||''))){
      frame.src='https://www.youtube.com/embed/'+d.videoId+'?autoplay=1&mute=1&playsinline=1&rel=0';
    }else{
      showOffline();
    }
  }catch(e){
    showOffline();
  }
})();
</script>
</body>
</html>
