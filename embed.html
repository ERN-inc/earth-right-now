<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EARTH RIGHT NOW — Live Embed</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{width:100%;height:100%;border:0}#ern-source{position:absolute;right:10px;bottom:10px;z-index:2;background:rgba(7,21,34,.78);color:#eef7ff;font:12px/1.4 system-ui,sans-serif;text-decoration:none;padding:6px 9px;border-radius:6px;max-width:calc(100% - 40px)}#ern-source:hover,#ern-source:focus-visible{background:#102b40;text-decoration:underline}#offline{display:none;box-sizing:border-box;position:absolute;inset:0;padding:24px;background:#071522;color:#eef7ff;font:16px/1.5 system-ui,sans-serif;text-align:center;align-content:center}#offline a{color:#69dbdc}</style>
</head>
<body>
<iframe id="ern-live" title="EARTH RIGHT NOW live stream" allow="autoplay; encrypted-media; picture-in-picture; web-share; fullscreen" allowfullscreen></iframe>
<a id="ern-source" href="https://ern-inc.github.io/earth-right-now/?utm_source=ern_embed&amp;utm_medium=referral&amp;utm_campaign=publisher_embed" target="_blank" rel="noopener noreferrer" aria-label="Visit EARTH RIGHT NOW official website">EARTH RIGHT NOW · Visit site</a>
<div id="offline" role="status"><p>EARTH RIGHT NOW live playback is currently unavailable.</p><p><a href="https://www.youtube.com/@earth_right_now/live" target="_blank" rel="noopener noreferrer">Check the live channel on YouTube</a> · <a href="./" target="_blank" rel="noopener noreferrer">Visit EARTH RIGHT NOW</a></p></div>
<script>
(()=>{
  const frame=document.getElementById('ern-live');
  const offline=document.getElementById('offline');
  let activeId=null;
  const showOffline=()=>{
    if(activeId!==null){frame.removeAttribute('src');activeId=null;}
    frame.style.display='none';
    offline.style.display='block';
  };
  async function refreshLive(){
    try{
      const r=await fetch('./live.json?ts='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw new Error('status unavailable');
      const d=await r.json();
      if(d.status==='live'&&typeof d.videoId==='string'&&/^[A-Za-z0-9_-]{11}$/.test(d.videoId)){
        if(activeId!==d.videoId){
          frame.src='https://www.youtube.com/embed/'+d.videoId+'?autoplay=1&mute=1&playsinline=1&rel=0';
          activeId=d.videoId;
        }
        frame.style.display='block';
        offline.style.display='none';
      }else if(d.status==='offline'){
        showOffline();
      }
    }catch(error){
      // An unreachable status endpoint does not prove the stream is offline.
      // Retain the last known player; offer channel fallback if none is known.
      if(activeId===null)showOffline();
      console.warn('ERN embed status refresh unavailable',error);
    }
  }
  refreshLive();
  setInterval(refreshLive,60000);
})();
</script>
</body>
</html>
